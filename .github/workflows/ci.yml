name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Runtime import and index fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile source
        run: python -m compileall -q app.py
      - name: Test persistence and validation contracts
        run: python -m pytest -q
